<svg width="180" height="180" viewBox="0 0 180 180" xmlns="http://www.w3.org/2000/svg">
  <!--
    Hareb Digital.

    Hier stand bis eben das v0-Logo aus dem Projekt-Gerüst — ein fremdes
    Zeichen auf jedem Browser-Tab und in jedem Google-Ergebnis.

    Das Zeichen ist die Wortmarke H/D auf ihr Wesentliches reduziert. Die
    spitzen Klammern der Vollversion fehlen mit Absicht: Google zeigt dieses
    Bild mit 16 Pixeln Kantenlänge, und dort ist alles, was nicht die
    Silhouette trägt, nur noch Grau. Was bei 16 Pixeln überlebt, entscheidet
    über das Zeichen, nicht das, was bei 500 gut aussieht.

    Eine gleichbleibende Strichstärke für alles, auch für den Schrägstrich.
    Er ist hier kein Trennzeichen, sondern das dritte Element der Marke, und
    ein dünnerer Strich hätte ihn zu einer Fuge gemacht.
  -->
  <defs>
    <!-- userSpaceOnUse, nicht der Standard objectBoundingBox: die Striche des
         H sind senkrecht, ihre Bounding-Box ist damit null Pixel breit, und ein
         waagerechter Verlauf darin hat keine Ausdehnung — die Buchstaben
         verschwanden spurlos. Feste Koordinaten spannen den Verlauf einmal
         ueber die ganze Marke, sodass jeder Strich das Stueck Farbe bekommt,
         das an seiner Stelle liegt. -->
    <linearGradient id="hd" gradientUnits="userSpaceOnUse"
                    x1="0" y1="80" x2="145" y2="0">
      <stop offset="0%"   stop-color="#22B8E6"/>
      <stop offset="30%"  stop-color="#4C6BF5"/>
      <stop offset="62%"  stop-color="#D336C8"/>
      <stop offset="100%" stop-color="#FB7A3C"/>
    </linearGradient>
  </defs>

  <rect width="180" height="180" rx="38" fill="#0B0C11"/>

  <g transform="translate(17.5,50)"
     stroke="url(#hd)" stroke-width="14" fill="none"
     stroke-linecap="square" stroke-linejoin="miter">
    <!-- H -->
    <path d="M7 7 V73"/>
    <path d="M37 7 V73"/>
    <path d="M7 40 H37"/>
    <!-- Schrägstrich -->
    <path d="M56 73 L76 7"/>
    <!-- D -->
    <path d="M95 7 V73"/>
    <path d="M95 7 H105 A33 33 0 0 1 105 73 H95"/>
  </g>
</svg>
