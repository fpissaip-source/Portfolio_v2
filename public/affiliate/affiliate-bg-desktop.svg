<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 864" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#02030a"/>
      <stop offset="0.48" stop-color="#030717"/>
      <stop offset="1" stop-color="#080622"/>
    </linearGradient>
    <radialGradient id="violetGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#d58cff" stop-opacity=".78"/>
      <stop offset=".18" stop-color="#9d63ff" stop-opacity=".42"/>
      <stop offset=".52" stop-color="#4d32b8" stop-opacity=".12"/>
      <stop offset="1" stop-color="#151027" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blueGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#d5e7ff" stop-opacity=".88"/>
      <stop offset=".12" stop-color="#699cff" stop-opacity=".62"/>
      <stop offset=".42" stop-color="#2858d8" stop-opacity=".2"/>
      <stop offset="1" stop-color="#071027" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="columnBlue" x1="0" x2="1">
      <stop offset="0" stop-color="#456eff" stop-opacity="0"/>
      <stop offset=".42" stop-color="#7698ff" stop-opacity=".2"/>
      <stop offset=".55" stop-color="#b3c5ff" stop-opacity=".5"/>
      <stop offset=".7" stop-color="#5f70ff" stop-opacity=".16"/>
      <stop offset="1" stop-color="#1c1c48" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="columnViolet" x1="0" x2="1">
      <stop offset="0" stop-color="#7449ff" stop-opacity="0"/>
      <stop offset=".45" stop-color="#c585ff" stop-opacity=".22"/>
      <stop offset=".58" stop-color="#f0b8ff" stop-opacity=".55"/>
      <stop offset=".72" stop-color="#a04eff" stop-opacity=".15"/>
      <stop offset="1" stop-color="#251735" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111a45" stop-opacity=".45"/>
      <stop offset=".28" stop-color="#07112b" stop-opacity=".72"/>
      <stop offset="1" stop-color="#010207"/>
    </linearGradient>
    <linearGradient id="reflection" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7f9cff" stop-opacity=".34"/>
      <stop offset=".18" stop-color="#685fff" stop-opacity=".14"/>
      <stop offset="1" stop-color="#1c1647" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur24"><feGaussianBlur stdDeviation="24"/></filter>
    <filter id="blur48"><feGaussianBlur stdDeviation="48"/></filter>
    <filter id="blur80"><feGaussianBlur stdDeviation="80"/></filter>
    <filter id="softNoise" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="2" seed="7" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono" result="faded"><feFuncA type="table" tableValues="0 .035"/></feComponentTransfer>
      <feBlend in="SourceGraphic" in2="faded" mode="screen"/>
    </filter>
  </defs>

  <rect width="1536" height="864" fill="url(#bg)"/>

  <g opacity=".54" filter="url(#blur80)">
    <ellipse cx="170" cy="570" rx="330" ry="105" fill="#233a92"/>
    <ellipse cx="600" cy="600" rx="370" ry="92" fill="#162962"/>
    <ellipse cx="1255" cy="540" rx="280" ry="145" fill="#4b43c7"/>
  </g>

  <g opacity=".42" filter="url(#blur48)">
    <ellipse cx="90" cy="610" rx="280" ry="54" fill="#5566d9"/>
    <ellipse cx="510" cy="612" rx="330" ry="45" fill="#314eaa"/>
    <ellipse cx="1160" cy="610" rx="300" ry="62" fill="#5968e9"/>
  </g>

  <g opacity=".45">
    <path d="M-80 275 180 4" stroke="#a75cff" stroke-width="4" opacity=".34"/>
    <path d="M-35 325 245 -15" stroke="#835bff" stroke-width="2" opacity=".27"/>
    <path d="M35 365 310 25" stroke="#7f6dff" stroke-width="1" opacity=".2"/>
  </g>

  <g>
    <rect x="1115" y="92" width="58" height="520" fill="url(#columnBlue)" opacity=".72"/>
    <rect x="1172" y="22" width="42" height="590" fill="url(#columnBlue)" opacity=".48"/>
    <rect x="1212" y="0" width="65" height="612" fill="url(#columnViolet)" opacity=".55"/>
    <rect x="1280" y="132" width="54" height="480" fill="url(#columnBlue)" opacity=".48"/>
    <rect x="1338" y="0" width="72" height="612" fill="url(#columnViolet)" opacity=".58"/>
    <rect x="1410" y="214" width="48" height="398" fill="url(#columnBlue)" opacity=".42"/>
    <rect x="1462" y="260" width="74" height="352" fill="url(#columnViolet)" opacity=".52"/>

    <g stroke-linecap="round">
      <path d="M1145 94v520" stroke="#7195ff" stroke-width="1.2" opacity=".55"/>
      <path d="M1205 24v588" stroke="#7d86ff" stroke-width="1" opacity=".46"/>
      <path d="M1246 0v612" stroke="#d197ff" stroke-width="1.3" opacity=".66"/>
      <path d="M1320 132v480" stroke="#778fff" stroke-width="1" opacity=".46"/>
      <path d="M1384 0v612" stroke="#dc91ff" stroke-width="1.5" opacity=".7"/>
      <path d="M1444 214v398" stroke="#7893ff" stroke-width="1" opacity=".5"/>
    </g>
  </g>

  <ellipse cx="1230" cy="602" rx="190" ry="180" fill="url(#blueGlow)" filter="url(#blur24)"/>
  <ellipse cx="1435" cy="365" rx="170" ry="220" fill="url(#violetGlow)" filter="url(#blur24)"/>
  <ellipse cx="1450" cy="596" rx="135" ry="110" fill="url(#violetGlow)" opacity=".64" filter="url(#blur24)"/>

  <rect y="602" width="1536" height="262" fill="url(#floor)"/>
  <path d="M0 620 C360 604 630 630 915 620 S1290 605 1536 614" fill="none" stroke="#7594ff" stroke-opacity=".34" stroke-width="2"/>
  <path d="M0 642 C380 630 690 650 1020 640 S1300 635 1536 640" fill="none" stroke="#655dff" stroke-opacity=".25" stroke-width="1.2"/>
  <path d="M0 683 C430 668 760 693 1110 681 S1370 675 1536 680" fill="none" stroke="#9d70ff" stroke-opacity=".2" stroke-width="1"/>
  <rect x="1090" y="602" width="175" height="262" fill="url(#reflection)" opacity=".46"/>
  <rect x="1320" y="602" width="155" height="262" fill="url(#reflection)" opacity=".42"/>

  <g opacity=".34" filter="url(#blur24)">
    <ellipse cx="1240" cy="620" rx="290" ry="28" fill="#4c69ff"/>
    <ellipse cx="1450" cy="684" rx="170" ry="25" fill="#a05cff"/>
  </g>

  <g opacity=".24">
    <path d="M750 614h690" stroke="#8aa4ff" stroke-width="1"/>
    <path d="M910 630h550" stroke="#9d7cff" stroke-width="1"/>
    <path d="M1030 652h430" stroke="#6f84ff" stroke-width="1"/>
  </g>

  <rect width="1536" height="864" fill="transparent" filter="url(#softNoise)" opacity=".65"/>
  <rect width="1536" height="864" fill="url(#bg)" opacity=".08"/>
</svg>